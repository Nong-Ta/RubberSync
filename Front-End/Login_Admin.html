<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Register - RubberSync</title>
    <!-- เปลี่ยนเป็นฟอนต์ Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif; /* เรียกใช้ฟอนต์ Sarabun */
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&q=80') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .admin-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
        }

        .logo-circle {
            width: 85px;
            height: 85px;
            background-color: white;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #b3a398;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .logo-text {
            color: #333;
            font-weight: 700;
            font-size: 12px;
        }

        .admin-card h2 {
            font-size: 24px; /* ปรับให้ใหญ่ขึ้น */
            font-weight: 700;
            color: #1e4d36;
            margin-bottom: 5px;
        }

        .admin-card p.subtitle {
            font-size: 16px; /* ปรับให้ใหญ่ขึ้น */
            font-weight: 400;
            color: #555;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 16px; /* ปรับให้ใหญ่ขึ้น */
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 18px; /* ปรับไอคอนให้ใหญ่ขึ้นนิดหน่อย */
        }

        input[type="text"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background-color: #f5f5f5;
            border: none;
            border-bottom: 2px solid #a3a3a3;
            font-size: 16px; /* ปรับให้ใหญ่ขึ้น */
            color: #333;
            outline: none;
            transition: border-color 0.3s;
        }

        input::placeholder {
            color: #888;
            font-weight: 400;
        }

        input:focus {
            border-bottom: 2px solid #1e4d36;
            background-color: #f0f4f1;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #1e4d36;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 18px; /* ปรับให้ใหญ่ขึ้น */
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .btn-submit:hover {
            background-color: #153826;
        }

        .logout-link {
            display: inline-block;
            color: #666;
            font-size: 16px; /* ปรับให้ใหญ่ขึ้น */
            text-decoration: underline;
            transition: color 0.2s;
        }

        .logout-link:hover {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <!-- โลโก้ -->
        <div class="logo-circle">
            <span class="logo-text">RubberSync</span>
        </div>

        <!-- หัวข้อ -->
        <h2>ลงชื่อผู้ดูแลระบบ</h2>
        <p class="subtitle">สร้างบัญชีผู้ดูแลระบบของคุณ</p>

        <!-- ฟอร์ม -->
        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="fullname">ชื่อ-นามสกุล</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="fullname" placeholder="กรอกชื่อและนามสกุลของคุณ" required maxlength="100">
                </div>
            </div>

            <div class="form-group">
                <label for="phone">เบอร์โทรศัพท์</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="phone" placeholder="กรอกเบอร์โทรศัพท์" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">รหัสผ่าน</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="กรอกรหัสผ่านของคุณ" required>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">ยืนยันรหัสผ่าน</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirm-password" placeholder="ยืนยันรหัสผ่านของคุณอีกครั้ง" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>

        </form>

        <a href="Login_User.html" class="logout-link">ออกจากระบบ</a>
    </div>

</body>
</html>
